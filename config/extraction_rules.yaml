# ---------------------------------------------------------------------------
# CONFIDENCE THRESHOLDS
# ---------------------------------------------------------------------------
confidence_thresholds:
  min_for_assignment: 0.55   # Below this → keep unknown, mark for review
  high: 0.85                  # High confidence (regex / exact pattern match)
  medium: 0.70                # Medium confidence (fuzzy match)
  low: 0.55                   # Low confidence (contextual fallback)
  manual_review_below: 0.60   # All fields below this trigger needs_manual_review

# ---------------------------------------------------------------------------
# FUZZY MATCHING SETTINGS
# ---------------------------------------------------------------------------
fuzzy_matching:
  default_threshold: 82       # Minimum score out of 100 (rapidfuzz ratio)
  partial_ratio_threshold: 78
  token_sort_threshold: 80
